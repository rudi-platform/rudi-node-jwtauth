; local config file for RUDI API module

[server]
listening_address = 127.0.0.1
listening_port = 4000

[database]
db_url = mongodb://127.0.0.1/
db_name = rudi_crypto

[logging]
app_name = rudiCrypto
log_dir = /tmp/devLogs/rudiCrypto
log_file = rudiCrypto.log
expires = 7d

[security]
public_key = ./.ssh/mngr.pub
private_key = ./.ssh/mngr.prv
