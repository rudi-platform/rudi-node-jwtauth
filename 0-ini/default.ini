; local config file for RUDI API module

[server]
listening_address = 127.0.0.1
listening_port = 4000

[rudi_prod_api]
address = 127.0.0.1
port = 3000
suffix = admin

[database]
db_url = mongodb://127.0.0.1/
db_name = rudi_prod

[logging]
app_name = rudiApiClient
log_dir = ./logs
log_file = rudiApiClient.log
expires = 1d
log_level = debug

[security]
; File that gathers the paths of the private and public keys for each account
profiles = ./0-ini/profiles.ini

; JWT expiration time
exp_time = 6000
